<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viaturas CMBEL</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--painel:#fff;--campo:#ececf0;--borda:#e0e0e5;--txt:#1d1d1f;--fraco:#6e6e73;--ouro:#0071e3;--verde:#248a3d;--verm:#d70015;--laranja:#c25e00;--sombra:0 1px 2px #0000000d,0 10px 30px #00000014;--g1:#8ec5ff8c;--g2:#9ff0d080;--g3:#cdbcff73;--brilho:#ffffffb8;--reflexo:#fffffff2}
@media(prefers-color-scheme:dark){:root{--bg:#000;--painel:#1c1c1e;--campo:#2c2c2e;--borda:#2c2c2e;--txt:#f5f5f7;--fraco:#98989d;--ouro:#0a84ff;--verde:#30d158;--verm:#ff453a;--laranja:#ff9f0a;--sombra:0 10px 30px #00000059;--g1:#0a4d9e73;--g2:#0b6b5266;--g3:#4b2a8f66;--brilho:#ffffff24;--reflexo:#ffffff33}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(70vmax 70vmax at 0% 0%,var(--g1),transparent 60%),radial-gradient(60vmax 60vmax at 100% 15%,var(--g2),transparent 60%),radial-gradient(70vmax 70vmax at 55% 115%,var(--g3),transparent 60%);background-attachment:fixed;color:var(--txt);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--bg);background:color-mix(in srgb,var(--bg) 75%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:center;gap:10px}.marca img{height:34px}.marca b{font-weight:600;font-size:16px}.marca small{display:block;color:var(--fraco);font-size:12px}
#quem{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fraco);text-align:right}
main{max-width:980px;margin:auto;padding:28px 20px 40px}
.card{background:var(--painel);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--sombra)}
h1{margin:0 0 16px;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--fraco);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 14px}
label{font-size:14px;color:var(--fraco)}
input,textarea,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid transparent;background:var(--campo);color:var(--txt);font:inherit;margin:6px 0 14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 4px color-mix(in srgb,var(--ouro) 22%,transparent)}
button{cursor:pointer;font:inherit;font-weight:600;border:0;border-radius:980px;padding:12px 22px;background:var(--ouro);color:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .2s ease,box-shadow .25s ease,background-color .22s ease,opacity .2s ease}
button.sec{background:var(--campo);color:var(--txt)}button.lnk{background:none;color:var(--ouro);font-weight:400;width:100%;padding:9px;margin-top:4px}
button.mini{padding:6px 13px;font-size:14px;font-weight:500}
button:disabled{opacity:.35;cursor:default}button:not(:disabled):hover{filter:brightness(1.08)}button:not(:disabled):active{transform:scale(.94);transition-duration:.06s}
.erro{color:var(--verm);font-size:15px;margin:0 0 12px}.erro:not(:empty){background:color-mix(in srgb,var(--verm) 10%,transparent);padding:10px 14px;border-radius:12px}
.falta{border-color:var(--verm)!important}
.garagem{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vt{background:var(--painel);border-radius:20px;padding:0 0 16px;overflow:hidden;text-align:left;color:var(--txt);font-weight:400;width:100%;box-shadow:var(--sombra);outline:3px solid transparent;outline-offset:-3px}
.vt:not(:disabled):hover{transform:translateY(-2px);filter:none;box-shadow:0 2px 4px #00000012,0 14px 34px #0000001f}.vt.sel{outline-color:var(--ouro)}
.foto{width:100%;height:160px;object-fit:cover;border-radius:14px;display:block;margin-bottom:12px}
.vt .foto{border-radius:0}.vt.off .foto{filter:grayscale(1);opacity:.5}.vt .nome,.vt .st{padding:0 16px}
.nome{font-weight:600;font-size:17px}
.st{display:flex;align-items:baseline;gap:7px;font-size:14px;color:var(--fraco);margin-top:2px}.st i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--fraco))}
.livre{--c:var(--verde)}.missao{--c:var(--verm)}.reserv{--c:var(--laranja)}
.vt.nova{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;box-shadow:none;border:1.5px dashed var(--borda);min-height:230px;padding:0;color:var(--ouro)}.mais{font-size:40px;font-weight:300;line-height:1}
.selo{display:block;height:84px;margin:4px auto 18px}
.barra{display:flex;gap:6px;margin:10px 0 22px}.barra span{flex:1;height:4px;border-radius:2px;background:var(--campo)}.barra span.on{background:var(--ouro)}
.linha{display:flex;gap:12px;flex-wrap:wrap}.linha>*{flex:1;min-width:130px}
.ped{background:var(--campo);border-radius:14px;padding:12px 14px;margin:8px 0}.ped small{color:var(--fraco);font-size:14px}.agora{box-shadow:inset 3px 0 var(--verm)}
.acoes{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}.acoes button{white-space:nowrap;flex:none}
.chave{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:16px;color:var(--txt)}.chave input{width:20px;height:20px;margin:0;accent-color:var(--verde)}
dialog{background:var(--painel);color:var(--txt);border:0;border-radius:22px;padding:24px;max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 70px #00000040}
dialog::backdrop{background:#00000059;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.dia{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:14px;background:var(--campo);color:var(--txt);font-weight:400;scroll-snap-align:start}
.dia b{font-size:20px;font-weight:600}.dia small{font-size:11px;color:var(--fraco);text-transform:uppercase}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:6px 0 16px}
.hora{padding:9px 0;border-radius:10px;background:var(--campo);color:var(--txt);font-weight:500;font-size:15px}
.dia.sel,.hora.sel{background:var(--ouro);color:#fff}.dia.sel small{color:#ffffffcc}
.dia:disabled,.hora:disabled{opacity:.3}.hora:disabled{text-decoration:line-through}
.abas{display:flex;gap:2px;background:var(--campo);padding:3px;border-radius:12px;margin:0 auto 28px;max-width:400px}
.abas button{flex:1;padding:7px 10px;border-radius:9px;font-size:15px;font-weight:500;background:var(--painel);color:var(--txt);box-shadow:0 1px 4px #00000026}.abas button.sec{background:none;box-shadow:none}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:12px 8px;border-bottom:1px solid var(--borda);text-align:left;vertical-align:top}tr:last-child td{border-bottom:0}
th{color:var(--fraco);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.quadro{overflow-x:auto;background:var(--painel);border-radius:20px;padding:6px 16px;box-shadow:var(--sombra)}.impresso{display:none}
.dia-t{margin:28px 0 10px;font-size:15px;font-weight:400;color:var(--fraco)}.dia-t b{color:var(--txt);font-weight:600}
.ag{display:grid;grid-template-columns:72px 120px 1fr auto;gap:16px;align-items:center;background:var(--painel);border-left:4px solid transparent;border-radius:20px;padding:14px 18px 14px 14px;margin-bottom:10px;box-shadow:var(--sombra)}
.ag.andando{border-left-color:var(--verm)}.ag.passou{opacity:.55}
.ag-hora{display:flex;flex-direction:column;text-align:center}.ag-hora b{font-size:22px;font-weight:700;line-height:1.1;margin-bottom:6px}.ag-hora span{font-size:16px;font-weight:500}.ag-hora small{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--fraco)}
.ag-foto{width:120px;height:82px;object-fit:cover;border-radius:12px}.ag-info{display:grid;gap:2px;min-width:0;font-size:15px}.ag-vt{font-weight:600;font-size:17px;margin-bottom:2px}.rot{color:var(--fraco)}
.ag-acoes{display:flex;flex-direction:column;gap:6px}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--campo);color:var(--fraco);vertical-align:middle;white-space:nowrap}.chip.verm{color:var(--verm);background:color-mix(in srgb,var(--verm) 12%,transparent)}
@media(max-width:640px){h1{font-size:25px}.ag{grid-template-columns:64px 1fr}.ag-foto{display:none}.ag-acoes{grid-column:1/-1;flex-direction:row}.marca small{display:none}}
footer{text-align:center;padding:0 16px 28px}footer button{background:none;color:var(--fraco);font-size:12px;font-weight:400;padding:4px 8px}
.faixa{text-align:center;font-size:12px;color:var(--fraco);background:var(--campo);padding:6px 12px}
.entrada,dialog,.abas,header{background:color-mix(in srgb,var(--painel) 50%,transparent);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--brilho);box-shadow:inset 0 1px 0 var(--reflexo),inset 0 -1px 0 #00000008,var(--sombra)}
header{border-width:0 0 1px;box-shadow:inset 0 -1px 0 #0000000a}
.entrada input,dialog input,dialog select,dialog textarea{background-color:color-mix(in srgb,var(--campo) 60%,transparent)}
.abas button{background:color-mix(in srgb,var(--painel) 88%,transparent);box-shadow:inset 0 1px 0 var(--reflexo),0 1px 5px #00000026}.abas button.sec{background:none;box-shadow:none}
.entrada{max-width:400px;margin:5vh auto 24px;padding:32px 28px;border-radius:28px}.entrada h1,.entrada h2{text-align:center}.entrada h1{margin-bottom:22px}
html{scroll-behavior:smooth}
main.entra>*{animation:entra .5s cubic-bezier(.2,.8,.2,1) both}main.entra>*:nth-child(2){animation-delay:.06s}main.entra>*:nth-child(n+3){animation-delay:.12s}
main.entra .garagem>*{animation:entra .55s cubic-bezier(.2,.8,.2,1) both}
main.entra .garagem>*:nth-child(2){animation-delay:.05s}main.entra .garagem>*:nth-child(3){animation-delay:.1s}main.entra .garagem>*:nth-child(4){animation-delay:.15s}main.entra .garagem>*:nth-child(5){animation-delay:.2s}main.entra .garagem>*:nth-child(6){animation-delay:.25s}main.entra .garagem>*:nth-child(n+7){animation-delay:.3s}
main.passo>*{animation:passo .42s cubic-bezier(.2,.8,.2,1) both}main.passoV>*{animation:passoV .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}}@keyframes passo{from{opacity:0;transform:translateX(36px)}}@keyframes passoV{from{opacity:0;transform:translateX(-36px)}}
dialog[open]{animation:abre .34s cubic-bezier(.2,.9,.3,1.12)}dialog[open]::backdrop{animation:fundo .3s ease}dialog.sai{animation:fecha .16s ease forwards}dialog.sai::backdrop{animation:fundoSai .16s ease forwards}
@keyframes abre{from{opacity:0;transform:scale(.92) translateY(12px)}}@keyframes fecha{to{opacity:0;transform:scale(.96)}}@keyframes fundo{from{opacity:0}}@keyframes fundoSai{to{opacity:0}}
.erro:not(:empty){animation:treme .32s ease}@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dia,.hora,.abas button,input,select,textarea,.vt .foto{transition:background-color .22s ease,color .22s ease,border-color .2s ease,box-shadow .2s ease,transform .25s cubic-bezier(.2,.8,.2,1),filter .3s ease}
.vt:not(:disabled):hover .foto{transform:scale(1.04)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{@page{size:landscape;margin:12mm}header,footer,.noprint,.faixa{display:none!important}body{background:#fff!important;color:#000}main{max-width:none;padding:0}
  .impresso{display:block}.cab{display:flex;gap:14px;align-items:center;margin-bottom:14px;font-size:15px}.cab img{height:70px}.assin{margin-top:40px}
  table{font-size:12px}th,td{border:1px solid #000;color:#000;padding:6px}th{background:#eee}}
</style>
</head>
<body>
<header><div class="marca"><img src="/img/brasao.png" alt="Brasão do CMBEL"><div><b>Viaturas CMBEL</b><small>Colégio Militar de Belém</small></div></div><span id="quem"></span></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<footer><button onclick="creditos()">Made in Zampiva</button></footer>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const api = async (url, body) => {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.erro), { status: r.status }); return j;
};
const fmt = (ms) => new Date(ms).toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const TIPOS = { onibus: ['Ônibus', 'onibus.jpg'], ambulancia: ['Ambulância', 'ambulancia.jpg'], doblo: ['Doblò / utilitário', 'doblo.jpg'],
  caminhao: ['Caminhão', '5ton.jpg'], van: ['Mini-van (Spin)', 'spin.jpg'], sedan: ['Sedã', 'versa.jpg'] };
const fotoSrc = (v) => esc(v?.foto || `/img/${(TIPOS[v?.tipo] || TIPOS.sedan)[1]}`);
const foto = (v) => `<img class="foto" src="${fotoSrc(v)}" alt="">`;
const anima = (tipo = 'entra') => { app.classList.remove('entra', 'passo', 'passoV'); void app.offsetWidth; app.classList.add(tipo);
  clearTimeout(anima.t); anima.t = setTimeout(() => app.classList.remove(tipo), 900); };
let eu, frota, rascunho;

async function iniciar() {
  try { eu = await api('/api/eu'); } catch { return telaLogin(); }
  $('#quem').innerHTML = `${esc(eu.posto)} ${esc(eu.nome)} <button class="sec mini" onclick="sair()">Sair</button>`;
  return eu.trocarSenha ? telaPerfil() : telaGaragem();
}
async function sair() { await api('/api/sair', {}); location.reload(); }

const POSTOS = ['', 'Gen', 'Cel', 'TC', 'Maj', 'Cap', '1º Ten', '2º Ten', 'Asp', 'ST', '1º Sgt', '2º Sgt', '3º Sgt', 'Cb', 'Sd', 'Servidor Civil'];
const campos = (extra = '') => `<label>Nome completo</label><input name="completo" autocomplete="name" required>
  <label>Nome de guerra</label><input name="nome" required style="text-transform:uppercase">
  <label>Posto/Graduação</label><select name="posto" required>${POSTOS.map((p) => `<option>${p}</option>`).join('')}</select>
  <label>Divisão/Seção</label><input name="secao" placeholder="Ex.: Div Adm, Corpo de Alunos, 1ª Cia" required>${extra}`;
const link = (txt, fn) => `<button type="button" class="lnk" onclick="${fn}">${txt}</button>`;
function formulario(titulo, sub, corpo, botao, acao, rodape = '') {
  $('#quem').innerHTML = '';
  app.innerHTML = `<div class="card entrada"><img class="selo" src="/img/brasao.png" alt="">
  <h2>${sub}</h2><h1>${titulo}</h1><form id="f" novalidate>${corpo}<p class="erro" id="e"></p><button style="width:100%;margin-top:4px">${botao}</button></form>${rodape}</div>`;
  scrollTo(0, 0); anima();
  $('#f').oninput = (ev) => { $('#e').textContent = ''; ev.target.classList.remove('falta'); };
  $('#f').onsubmit = async (ev) => { ev.preventDefault();
    const faltam = [...ev.target.elements].filter((el) => el.required && !el.value.trim());
    faltam.forEach((el) => el.classList.add('falta'));
    if (faltam.length) { $('#e').textContent = 'Preencha: ' + faltam.map((el) => el.previousElementSibling?.textContent.split(' —')[0] || el.name).join(', ') + '.';
      return faltam[0].focus(); }
    const b = ev.target.querySelector('button:not([type])'); b.disabled = true;
    try { await acao(Object.fromEntries(new FormData(ev.target))); } catch (e) { $('#e').textContent = e.message; $('#e').scrollIntoView({ block: 'center', behavior: 'smooth' }); } b.disabled = false; };
}
function telaLogin(aviso = '') {
  formulario('Identifique-se', 'Acesso', `<label>Identidade militar</label><input name="identidade" inputmode="numeric" autocomplete="username" required>
    <label>Senha</label><input name="senha" type="password" autocomplete="current-password" required>
    <p><small style="color:var(--fraco)">Primeiro acesso? Digite sua identidade e a senha <b>123</b>.</small></p>
    ${aviso ? `<p style="color:var(--verde)">${esc(aviso)}</p>` : ''}`, 'Entrar',
    async (d) => { await api('/api/login', d); iniciar(); },
    link('Criar conta', 'telaCriar()') + link('Esqueci minha senha', 'telaEsqueci()')
    + `<hr style="border:0;border-top:1px solid var(--borda);margin:12px 0 4px">` + link('Entrar como administrador', 'telaAdminLogin()'));
}
function telaCriar() {
  formulario('Criar conta', 'Primeiro acesso', `<label>Identidade militar</label><input name="identidade" inputmode="numeric" required>
    <p><small style="color:var(--fraco)">A conta nasce com a senha de primeiro acesso repassada pela seção. Ao entrar, você cria sua senha pessoal.</small></p>`,
    'Criar conta', async (d) => { await api('/api/criar-conta', d); telaLogin('Conta criada. Entre com a senha de primeiro acesso.'); },
    link('Voltar', 'telaLogin()'));
}
function telaEsqueci() {
  formulario('Esqueci minha senha', 'Recuperar acesso', `<p><small style="color:var(--fraco)">Informe os mesmos dados do seu cadastro. Se conferirem, você cria uma senha nova.</small></p>
    <label>Identidade militar</label><input name="identidade" inputmode="numeric" required>${campos(`<label>Crie sua senha — <b>mínimo 6 letras ou números</b> (ex.: cordeiro26)</label><input name="senha" type="password" autocomplete="new-password" required>`)}`,
    'Criar senha nova', async (d) => { await api('/api/recuperar-senha', d); telaLogin('Senha alterada. Entre com a senha nova.'); },
    link('Voltar', 'telaLogin()'));
}
function telaPerfil() {
  formulario('Complete seu cadastro', 'Primeiro acesso', `<p><small style="color:var(--fraco)">Guarde bem estes dados: eles servem para recuperar a senha.</small></p>
    ${campos(`<label>Crie sua senha — <b>mínimo 6 letras ou números</b> (ex.: cordeiro26)</label><input name="senha" type="password" autocomplete="new-password" required>`)}`,
    'Salvar e continuar', async (d) => { await api('/api/perfil', d); iniciar(); }, link('Sair', 'sair()'));
}

// Perfil administrativo: entra só com a senha. Agenda de missões e controle de viaturas e militares.
let credAdmin = null, adados = null, aba = 'agenda';
try { credAdmin = JSON.parse(sessionStorage.getItem('adm')); } catch {}
const horaIso = (ms) => new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
const hm = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
async function entrarAdmin(cred) {
  adados = await api('/api/admin/entrar', cred); credAdmin = cred;
  try { sessionStorage.setItem('adm', JSON.stringify(cred)); } catch {}
  telaAdmin(true);
}
function sairAdmin() { credAdmin = null; try { sessionStorage.removeItem('adm'); } catch {} iniciar(); }
const aapi = async (rota, dados) => { await api('/api/admin/' + rota, { ...dados, ...credAdmin }); adados = await api('/api/admin/entrar', credAdmin); telaAdmin(); };
const vtDe = (id) => adados.viaturas.find((v) => v.id === id);
function telaAdminLogin() {
  formulario('Perfil administrativo', 'Acesso restrito', `<label>Senha do perfil administrativo</label><input name="senha_admin" type="password" inputmode="numeric" autocomplete="off" required>`,
    'Acessar', (d) => entrarAdmin(d), link('Voltar', 'telaLogin()'));
  $('#f input').focus();
}
function telaAdmin(nova) {
  $('#quem').innerHTML = `Administrador <button class="sec mini" onclick="sairAdmin()">Sair</button>`;
  const abas = [['agenda', 'Agenda'], ['viaturas', 'Viaturas'], ['militares', 'Militares']]
    .map(([k, t]) => `<button class="${aba === k ? '' : 'sec'}" onclick="aba='${k}';telaAdmin(true)">${t}</button>`).join('');
  app.innerHTML = `<div class="abas noprint">${abas}</div>${{ agenda: aAgenda, viaturas: aViaturas, militares: aMilitares }[aba]()}`;
  if (nova) { scrollTo(0, 0); anima(); }
}

// Agenda: um cartão por missão, agrupado por dia. Primeiro o que está mais perto; as já cumpridas ficam no fim.
function aAgenda() {
  const agora = Date.now(), hoje = meiaNoite(agora);
  const fut = adados.pedidos.filter((p) => p.fim > agora), pas = adados.pedidos.filter((p) => p.fim <= agora).reverse();
  const andando = fut.filter((p) => p.inicio <= agora).length;
  const tituloDia = (ms) => { const d = Math.round((meiaNoite(ms) - hoje) / 864e5);
    return `<h3 class="dia-t">${d === 0 ? '<b>Hoje</b> · ' : d === 1 ? '<b>Amanhã</b> · ' : d === -1 ? '<b>Ontem</b> · ' : ''}${new Date(ms).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</h3>`; };

  const porDia = (lista) => { let ult; return lista.map((p) => { const d = meiaNoite(p.inicio), t = d !== ult ? tituloDia(p.inicio) : ''; ult = d; return t + cartao(p); }).join(''); };

    ${pas.length ? `<h2 style="margin-top:28px">Missões anteriores</h2>${porDia(pas)}` : ''}</div>
    <div class="impresso"><div class="cab"><img src="/img/brasao.png" alt=""><div><b>COLÉGIO MILITAR DE BELÉM</b><br>Quadro de Missões de Viaturas<br><small>Emitido em ${fmt(agora)}</small></div></div>

// Reduz a foto escolhida para caber no banco (máx. 800 px de largura, JPEG).
function lerFoto(arquivo) {
  return new Promise((ok, falha) => { const img = new Image();
    img.onload = () => { const k = Math.min(1, 800 / img.width), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => falha(new Error('Não consegui abrir essa imagem. Use uma foto JPG ou PNG.'));
    img.src = URL.createObjectURL(arquivo); });
}

function status(v) {
  const ag = frota.agora, ps = frota.pedidos.filter((p) => p.viatura === v.id);
  if (!v.disponivel) return { cls: 'missao', txt: `Indisponível · ${v.motivo || ''}`, ps };
  const atual = ps.find((p) => p.inicio <= ag && p.fim > ag);
  if (atual) return { cls: 'missao', txt: `Em missão · ${atual.posto} ${atual.nome}`, ps };
  const prox = ps.find((p) => p.inicio > ag);
  return prox ? { cls: 'reserv', txt: `Livre · próx. ${fmt(prox.inicio)}`, ps } : { cls: 'livre', txt: 'Disponível', ps };
}

// Wizard em etapas: Viatura → Quando → Onde → Missão → Confirmar
const ETAPAS = ['Viatura', 'Quando', 'Onde', 'Missão', 'Confirmar'];
function novaMissao(vt) { if (vt && !frota.viaturas.find((v) => v.id === vt)?.disponivel) vt = ''; rascunho = { viatura: vt || '', etapa: vt ? 1 : 0 }; etapa(); }
function etapa() {
  const r = rascunho, n = r.etapa;
  const corpo = [
    () => `<h1>Qual viatura?</h1><div class="garagem">${frota.viaturas.filter((v) => v.disponivel).map((v) => `<button class="vt ${r.viatura === v.id ? 'sel' : ''}" onclick="rascunho.viatura='${v.id}';etapa()">${foto(v)}<div class="nome">${esc(v.nome)}</div></button>`).join('')}</div>`,
    () => telaQuando(r),
    () => `<h1>Para onde?</h1><label>Destino</label><input id="destino" placeholder="Ex.: 8ª RM, Aeroporto, Base Naval" value="${esc(r.destino || '')}">`,
    () => `<h1>Qual a missão?</h1><label>Descrição</label><textarea id="missao" rows="4" placeholder="Ex.: Transporte de material escolar">${esc(r.missao || '')}</textarea>`,
    () => `<h1>Confirmar missão</h1>${foto(frota.viaturas.find((v) => v.id === r.viatura))}
      <div class="ped"><b>${esc(nomeVt(r.viatura))}</b> → ${esc(r.destino)}<br><small>${fmt(r.ini)} até ${fmt(r.fim)}<br>Missão: ${esc(r.missao)}<br>Solicitante: ${esc(eu.posto)} ${esc(eu.nome)}</small></div>`,
  ][n]();
  app.innerHTML = `<div class="card"><h2>Etapa ${n + 1} de 5 · ${ETAPAS[n]}</h2><div class="barra">${ETAPAS.map((_, i) => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>
  ${corpo}<p class="erro" id="e"></p><div class="acoes"><button class="sec" onclick="${n ? 'voltar()' : 'telaGaragem()'}">${n ? 'Voltar' : 'Cancelar'}</button>
  <button onclick="avancar()" ${n === 0 && !r.viatura ? 'disabled' : ''}>${n === 4 ? 'Confirmar pedido' : 'Continuar'}</button></div></div>`;
  app.querySelectorAll('input,textarea').forEach((el) => { el.oninput = () => { $('#e').textContent = ''; };
    el.onkeydown = (ev) => { if (ev.key === 'Enter' && (el.tagName === 'INPUT' || ev.ctrlKey)) { ev.preventDefault(); avancar(); } }; });
  if (r.etapaVista !== n) { anima(r.etapaVista == null ? 'entra' : n > r.etapaVista ? 'passo' : 'passoV');
    r.etapaVista = n; scrollTo(0, 0); app.querySelector('input,textarea')?.focus({ preventScroll: true }); }
}
// Etapa "Quando": cartões de dia + botões de horário. Bloqueia antes de 48h e horários já reservados.
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], H = 36e5;
const meiaNoite = (ms) => new Date(ms).setHours(0, 0, 0, 0);
const hhmm = (m) => `${String(m / 60 | 0).padStart(2, '0')}:${m % 60 ? '30' : '00'}`;
const HORAS = Array.from({ length: 35 }, (_, i) => 300 + i * 30); // 05:00 a 22:00
function telaQuando(r) {
  const ocup = frota.pedidos.filter((p) => p.viatura === r.viatura), limite = Date.now() + 48 * H;
  const livre = (a, b) => !ocup.some((p) => a < p.fim && b > p.inicio);
  const dias = (de, qtd, chave, ok) => `<div class="dias">${Array.from({ length: qtd }, (_, i) => {
    const d = new Date(de); d.setDate(d.getDate() + i); const ms = +d, pode = ok(ms);
    return `<button class="dia ${r[chave] === ms ? 'sel' : ''}" ${pode ? '' : 'disabled'} onclick="marcar('${chave}',${ms})">
      <small>${DIAS[d.getDay()]}</small><b>${d.getDate()}</b><small>${d.toLocaleString('pt-BR', { month: 'short' })}</small></button>`; }).join('')}</div>`;
  const horas = (dia, chave, ok) => `<div class="horas">${HORAS.map((m) => { const t = dia + m * 6e4, pode = ok(t);
    return `<button class="hora ${r[chave] === m ? 'sel' : ''}" ${pode ? '' : 'disabled'} title="${pode ? '' : 'Indisponível'}" onclick="marcar('${chave}',${m})">${hhmm(m)}</button>`; }).join('')}</div>`;
  const hoje = meiaNoite(Date.now());
  let html = `<h1>Quando?</h1><p style="color:var(--fraco)">Antecedência mínima de 48 horas · horários riscados já estão ocupados.</p>
    <label>Dia da saída</label>${dias(hoje, 21, 'dia', (ms) => ms + 24 * H > limite)}`;
  if (r.dia != null) html += `<label>Horário de saída</label>${horas(r.dia, 'hi', (t) => t >= limite && livre(t, t + 30 * 6e4))}`;
  if (r.hi != null) { const ini = r.dia + r.hi * 6e4;
    html += `<label>Dia do retorno</label>${dias(r.dia, 7, 'diaV', (ms) => livre(ini, Math.max(ms, ini + 1)))}`;
    if (r.diaV != null) html += `<label>Horário de retorno</label>${horas(r.diaV, 'hf', (t) => t > ini && livre(ini, t))}`; }
  if (r.ini && r.fim) html += `<div class="ped">Saída <b>${fmt(r.ini)}</b> → Retorno <b>${fmt(r.fim)}</b> · ${((r.fim - r.ini) / H).toFixed(1).replace('.0', '')}h de missão</div>`;
  return html;
}
function marcar(chave, v) {
  const r = rascunho; r[chave] = v;
  const zera = { dia: ['hi', 'diaV', 'hf'], hi: ['diaV', 'hf'], diaV: ['hf'] }[chave] || [];
  zera.forEach((k) => delete r[k]);
  if (chave === 'hi') r.diaV = r.dia; // retorno no mesmo dia por padrão
  r.ini = r.hi != null ? r.dia + r.hi * 6e4 : null;
  r.fim = r.hf != null ? r.diaV + r.hf * 6e4 : null;
  etapa();
  const alvo = r.fim ? app.querySelector('.card .ped') : [...app.querySelectorAll('.card label')].pop();
  alvo?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function guardar() { for (const k of ['destino', 'missao']) { const el = document.getElementById(k); if (el) rascunho[k] = el.value.trim(); } }
function voltar() { guardar(); rascunho.etapa--; etapa(); }
async function avancar() {
  guardar(); const r = rascunho, e = $('#e');
  if (r.etapa === 1) {
    const i = r.ini, f = r.fim;
    if (!i || !f || f <= i) return (e.textContent = 'Informe saída e um retorno depois da saída.');
    if (i - Date.now() < 48 * 3600e3) return (e.textContent = 'O pedido precisa de 48 horas de antecedência.');
  }
  if (r.etapa === 2 && !r.destino) return (e.textContent = 'Informe o destino.');
  if (r.etapa === 3 && !r.missao) return (e.textContent = 'Descreva a missão.');
  if (r.etapa < 4) { r.etapa++; return etapa(); }
  try { await api('/api/pedido', { viatura: r.viatura, inicio: r.ini, fim: r.fim, destino: r.destino, missao: r.missao });
    await telaGaragem(); avisar('Missão registrada.'); } catch (err) { e.textContent = err.message; }
}
const dlg = $('#dlg');
{ const fechar = dlg.close.bind(dlg), abrir = dlg.showModal.bind(dlg); let t;
  dlg.close = () => { if (!dlg.open) return; dlg.classList.add('sai'); clearTimeout(t); t = setTimeout(() => { dlg.classList.remove('sai'); fechar(); }, 160); };
  dlg.showModal = () => { clearTimeout(t); dlg.classList.remove('sai'); if (!dlg.open) abrir(); }; }
if (credAdmin) entrarAdmin(credAdmin).catch(sairAdmin); else iniciar();
